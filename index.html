<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5ee"><title>Los 3 añitos de Isa ✨</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff5ee;font-family:Georgia,serif;color:#776a61}.page{position:relative;width:min(100%,600px);margin:auto;line-height:0}.page img{width:100%;height:auto;display:block}.cover{cursor:pointer;min-height:100svh;display:flex;align-items:center}.cover img{width:100%}#content{display:none}#content.visible{display:block;animation:reveal 1s ease both}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.hotspot{position:absolute;display:block;cursor:pointer;border-radius:22px;z-index:2}.hotspot:focus-visible{outline:3px solid #e997aa;outline-offset:3px}.map{left:77%;top:83%;width:21%;height:12%}.message{left:52%;top:46%;width:45%;height:23%}.rsvp{left:51%;top:70%;width:46%;height:12%}.numbers{position:absolute;left:12%;right:12%;top:25.5%;height:7%;display:grid;grid-template-columns:repeat(4,1fr);gap:0;align-items:center;pointer-events:none}.numbers span{text-align:center;font:600 clamp(17px,5vw,30px) Georgia,serif;color:#c46f88;line-height:1;display:flex;align-items:center;justify-content:center}.spark{position:fixed;pointer-events:none;z-index:30;width:3px;height:3px;border-radius:50%;background:#f4d5a6;box-shadow:0 0 7px 2px #fff1d8;animation:burst 1.5s ease-out forwards}@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.2)}25%{opacity:.8}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}.music-toggle{position:fixed;z-index:40;right:14px;top:14px;border:1px solid #e9c5c3;border-radius:50px;background:#fff8f0ed;color:#8d806c;padding:10px 13px;font:15px Georgia,serif;box-shadow:0 3px 14px #aa8b7b22;cursor:pointer}.music-toggle:focus-visible{outline:2px solid #c46f88}
@media(min-width:601px){body{background:#fcece8}.page{box-shadow:0 0 30px #bdaaa533}.numbers span{font-size:29px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style></head><body><button id="musicToggle" class="music-toggle" aria-label="Activar música" aria-pressed="false" hidden>♪ Música</button><main><section id="cover" class="page cover" role="button" tabindex="0" aria-label="Tocá el sobre para abrir la invitación"><img src="portada.png" alt="Tenés una invitación especial. Tocá el sobre y descubrila"></section><div id="content"><section class="page"><img src="invitacion.png" alt="Isa cumple tres añitos. Domingo 20 de diciembre de 2026, de 15 a 19 horas, Salón de Eventos Sueños Dorados, Tomás Valle 6007, González Catán"><a class="hotspot map" aria-label="Ver ubicación en Google Maps" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=Eventos%20Sue%C3%B1os%20Dorados%2C%20Tom%C3%A1s%20Valle%206007%2C%20Gonz%C3%A1lez%20Cat%C3%A1n"></a></section><section class="page"><img src="final.png" alt="Falta muy poquito. Cuenta regresiva, mensajes para Isa y confirmar asistencia"><div class="numbers" aria-label="Cuenta regresiva"><span id="days">--</span><span id="hours">--</span><span id="minutes">--</span><span id="seconds">--</span></div><a class="hotspot message" aria-label="Dejar un mensaje para Isa" target="_blank" rel="noopener noreferrer" href="https://forms.gle/SELyTALn21Fi6p2w5"></a><a class="hotspot rsvp" aria-label="Confirmar asistencia por WhatsApp" target="_blank" rel="noopener noreferrer" href="https://wa.me/5491162339934?text=Gracias%20por%20la%20invitaci%C3%B3n%21%20Confirmo%20mi%20asistencia%20%E2%99%A5"></a></section></div></main><script>
const cover=document.getElementById('cover'),content=document.getElementById('content');
const musicButton=document.getElementById('musicToggle');
let audioCtx,playing=false,musicTimer=null,noteIndex=0;
// Melodía original de cuento, generada en el navegador sin archivos externos.
const melody=[[72,0.4],[76,0.4],[79,0.6],[76,0.4],[74,0.4],[72,0.7],[69,0.4],[72,0.4],[76,0.7],[79,0.4],[81,0.4],[79,0.7],[76,0.4],[74,0.4],[72,0.9],[null,0.3],[74,0.4],[77,0.4],[81,0.6],[79,0.4],[76,0.4],[74,0.7],[72,0.4],[69,0.4],[72,0.7],[76,0.4],[74,0.4],[72,1.0],[null,0.4]];
function tone(midi,duration){if(!audioCtx||midi===null)return;const t=audioCtx.currentTime;const hz=440*Math.pow(2,(midi-69)/12);for(const [wave,gainLevel,offset] of [['sine',0.035,0],['triangle',0.008,12]]){const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=wave;osc.frequency.value=hz*Math.pow(2,offset/12);gain.gain.setValueAtTime(0.0001,t);gain.gain.exponentialRampToValueAtTime(gainLevel,t+0.025);gain.gain.exponentialRampToValueAtTime(0.0001,t+Math.min(duration+0.3,1.2));osc.connect(gain).connect(audioCtx.destination);osc.start(t);osc.stop(t+Math.min(duration+0.32,1.22))}}
function playNext(){if(!playing)return;const [note,duration]=melody[noteIndex++%melody.length];tone(note,duration);musicTimer=setTimeout(playNext,duration*750)}
function startMusic(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();audioCtx.resume();if(!playing){playing=true;playNext()}musicButton.textContent='♪ Música activada';musicButton.setAttribute('aria-pressed','true');musicButton.setAttribute('aria-label','Silenciar música')}catch(e){musicButton.textContent='♪ Música'}}
function stopMusic(){playing=false;clearTimeout(musicTimer);if(audioCtx)audioCtx.suspend();musicButton.textContent='♪ Música';musicButton.setAttribute('aria-pressed','false');musicButton.setAttribute('aria-label','Activar música')}
musicButton.addEventListener('click',()=>playing?stopMusic():startMusic());
function openInvite(){if(content.classList.contains('visible'))return;musicButton.hidden=false;startMusic();if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<24;i++){const s=document.createElement('span');s.className='spark';s.style.left=(30+Math.random()*40)+'vw';s.style.top=(35+Math.random()*30)+'vh';s.style.background=['#f4d5a6','#f2cbd6','#d3ddc5'][i%3];s.style.setProperty('--x',(Math.random()*300-150)+'px');s.style.setProperty('--y',(Math.random()*360-180)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1600)}}setTimeout(()=>{cover.style.display='none';content.classList.add('visible');window.scrollTo(0,0)},650)}
cover.addEventListener('click',openInvite);cover.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openInvite()}});
function tick(){const target=new Date('2026-12-20T15:00:00-03:00').getTime();let left=Math.max(0,Math.floor((target-Date.now())/1000));const days=Math.floor(left/86400);left%=86400;const hrs=Math.floor(left/3600);left%=3600;const mins=Math.floor(left/60),secs=left%60;for(const [id,val] of [['days',days],['hours',hrs],['minutes',mins],['seconds',secs]])document.getElementById(id).textContent=String(val).padStart(2,'0')}tick();setInterval(tick,1000);
</script></body></html>
