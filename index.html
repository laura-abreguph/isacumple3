</style></head><body><button id="musicToggle" class="music-toggle" aria-label="Activar música" aria-pressed="false" hidden>♪ Música</button><main><section id="cover" class="page cover" role="button" tabindex="0" aria-label="Tocá el sobre para abrir la invitación"><img src="portada.png" alt="Tenés una invitación especial. Tocá el sobre y descubrila"></section><div id="content"><section class="page"><img src="invitacion.png" alt="Isa cumple tres añitos. Domingo 20 de diciembre de 2026, de 15 a 19 horas, Salón de Eventos Sueños Dorados, Tomás Valle 6007, González Catán"><a class="hotspot map" aria-label="Ver ubicación en Google Maps" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=Eventos%20Sue%C3%B1os%20Dorados%2C%20Tom%C3%A1s%20Valle%206007%2C%20Gonz%C3%A1lez%20Cat%C3%A1n"></a></section><section class="page"><img src="final.png" alt="Falta muy poquito. Cuenta regresiva, mensajes para Isa y confirmar asistencia"><div class="numbers" aria-label="Cuenta regresiva"><span id="days">--</span><span id="hours">--</span><span id="minutes">--</span><span id="seconds">--</span></div><a class="hotspot message" aria-label="Dejar un mensaje para Isa" target="_blank" rel="noopener noreferrer" href="https://forms.gle/SELyTALn21Fi6p2w5"></a><a class="hotspot rsvp" aria-label="Confirmar asistencia por WhatsApp" target="_blank" rel="noopener noreferrer" href="https://wa.me/5491162339934?text=Gracias%20por%20la%20invitaci%C3%B3n%21%20Confirmo%20mi%20asistencia%20%E2%99%A5"></a></section></div></main><script>
const cover=document.getElementById('cover'),content=document.getElementById('content');
const musicButton=document.getElementById('musicToggle');
let audioCtx,playing=false,musicTimer=null,noteIndex=0;
// Vals alegre original de princesa dinosaurio: 6/8, piano-campanitas y acompañamiento.
const melody=[ [76,1],[79,.5],[81,.5],[79,1],[76,1],[74,.5],[76,.5],[79,1],
[81,1],[84,.5],[83,.5],[81,1],[79,1],[76,.5],[74,.5],[76,1],
[79,1],[81,.5],[84,.5],[86,1],[84,1],[81,.5],[79,.5],[76,1],
[77,.5],[79,.5],[81,1],[79,.5],[76,.5],[74,1],[72,2] ];
const chords=[[60,64,67],[57,60,64],[65,69,72],[67,71,74]];
let step=0, nextAt=0, scheduler=null;
function note(midi,at,dur,vol=.065,type='sine'){if(!audioCtx)return;const hz=440*Math.pow(2,(midi-69)/12);for(const [kind,amount,oct] of [[type,vol,0],['triangle',vol*.22,12]]){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=kind;o.frequency.value=hz*Math.pow(2,oct/12);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(amount,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+dur+.22);o.connect(g).connect(audioCtx.destination);o.start(at);o.stop(at+dur+.24)}}
function schedule(){if(!playing||!audioCtx)return;const beat=.255;while(nextAt<audioCtx.currentTime+.18){const [m,beats]=melody[step%melody.length];note(m,nextAt,beats*beat*.9,.065,'sine');if(step%4===0){const ch=chords[Math.floor(step/4)%chords.length];note(ch[0]-12,nextAt,.5,.03,'triangle');note(ch[1],nextAt+.03,.65,.017,'sine');note(ch[2],nextAt+.03,.65,.017,'sine')}nextAt+=beats*beat;step++}scheduler=setTimeout(schedule,70)}
function startMusic(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();audioCtx.resume();if(!playing){playing=true;nextAt=audioCtx.currentTime+.05;schedule()}musicButton.textContent='♫ Silenciar';musicButton.setAttribute('aria-pressed','true');musicButton.setAttribute('aria-label','Silenciar música')}catch(e){musicButton.textContent='♫ Música'}}
function stopMusic(){playing=false;clearTimeout(scheduler);if(audioCtx)audioCtx.suspend();musicButton.textContent='♫ Música';musicButton.setAttribute('aria-pressed','false');musicButton.setAttribute('aria-label','Activar música')}
musicButton.addEventListener('click',()=>playing?stopMusic():startMusic());
function openInvite(){if(content.classList.contains('visible')||cover.dataset.opened)return;cover.dataset.opened='true';musicButton.hidden=false;startMusic();if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){const r=cover.getBoundingClientRect(),cx=r.left+r.width*.52,cy=Math.min(innerHeight*.65,r.top+r.height*.62);for(let i=0;i<65;i++){const a=Math.random()*Math.PI*2,dist=45+Math.random()*Math.min(innerWidth*.55,290),s=document.createElement('span');s.className='spark';s.style.left=(cx+(Math.random()-.5)*55)+'px';s.style.top=(cy+(Math.random()-.5)*55)+'px';s.style.setProperty('--size',(3+Math.random()*4)+'px');s.style.setProperty('--color',['#f7cf9b','#f6b9ce','#fff4cb','#dce6c7'][i%4]);s.style.setProperty('--x',(Math.cos(a)*dist)+'px');s.style.setProperty('--y',(Math.sin(a)*dist-65)+'px');s.style.animationDelay=(Math.random()*.35)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2450)}}setTimeout(()=>{cover.style.display='none';content.classList.add('visible');window.scrollTo(0,0)},1150)}
cover.addEventListener('click',openInvite);cover.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openInvite()}});
function tick(){const target=new Date('2026-12-20T15:00:00-03:00').getTime();let left=Math.max(0,Math.floor((target-Date.now())/1000));const days=Math.floor(left/86400);left%=86400;const hrs=Math.floor(left/3600);left%=3600;const mins=Math.floor(left/60),secs=left%60;for(const [id,val] of [['days',days],['hours',hrs],['minutes',mins],['seconds',secs]])document.getElementById(id).textContent=String(val).padStart(2,'0')}tick();setInterval(tick,1000);
</script></body></html>
